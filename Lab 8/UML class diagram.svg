<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320">
  <style>
    .box { fill: #ffffff; stroke: #1f2933; stroke-width: 1.5; }
    .head { fill: #e8eef6; stroke: #1f2933; stroke-width: 1.5; }
    .main { stroke-dasharray: 7 4; }
    .title { font: bold 20px Arial, Helvetica, sans-serif; fill: #1f2933; }
    .name { font: bold 16px Arial, Helvetica, sans-serif; fill: #1f2933; }
    .abstract-name { font: italic bold 16px Arial, Helvetica, sans-serif; fill: #1f2933; }
    .stereo { font: italic 12px Arial, Helvetica, sans-serif; fill: #3e4c59; }
    .member { font: 13px Consolas, "Courier New", monospace; fill: #1f2933; }
    .abstract { font-style: italic; }
    .static { text-decoration: underline; }
    .label { font: italic 13px Arial, Helvetica, sans-serif; fill: #1f2933; }
    .mult { font: 13px Arial, Helvetica, sans-serif; fill: #1f2933; }
    .legend { font: 12px Arial, Helvetica, sans-serif; fill: #52606d; }
    .line { stroke: #1f2933; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 7 5; }
  </style>

  <rect width="1400" height="1320" fill="#ffffff"/>
  <text class="title" x="700" y="44" text-anchor="middle">Inventory Management System: UML Class Diagram</text>

  <!-- main.py (main program, not a class) -->
  <rect class="box main" x="440" y="80" width="520" height="312"/>
  <rect class="head main" x="440" y="80" width="520" height="52"/>
  <text class="stereo" x="700" y="100" text-anchor="middle">«main program»</text>
  <text class="name" x="700" y="120" text-anchor="middle">main.py</text>
  <text class="member" x="452" y="151">+ load_inventory(inventory: Inventory): bool</text>
  <text class="member" x="452" y="171">+ save_inventory(inventory: Inventory): void</text>
  <text class="member" x="452" y="191">+ validate_product_entry(product_name: str,</text>
  <text class="member" x="495" y="211">product_quantity: str, product_price: str): bool</text>
  <text class="member" x="452" y="231">+ transactional_history(action: str, product_name: str,</text>
  <text class="member" x="495" y="251">product_quantity, product_price): void</text>
  <text class="member" x="452" y="271">+ choose_product_type(): str</text>
  <text class="member" x="452" y="291">+ ask_positive_number(prompt: str): float</text>
  <text class="member" x="452" y="311">+ add_product(inventory: Inventory): void</text>
  <text class="member" x="452" y="331">+ update_stock(inventory: Inventory): void</text>
  <text class="member" x="452" y="351">+ search_product(inventory: Inventory): void</text>
  <text class="member" x="452" y="371">+ main(): void</text>

  <!-- Inventory class -->
  <rect class="box" x="30" y="470" width="360" height="204"/>
  <rect class="head" x="30" y="470" width="360" height="44"/>
  <text class="name" x="210" y="498" text-anchor="middle">Inventory</text>
  <line class="line" x1="30" y1="544" x2="390" y2="544"/>
  <text class="member" x="42" y="533">- __products: list[Product]</text>
  <text class="member" x="42" y="563">+ __init__()</text>
  <text class="member" x="42" y="583">+ add_product(product: Product): void</text>
  <text class="member" x="42" y="603">+ find_by_id(product_id: int): Product | None</text>
  <text class="member" x="42" y="623">+ search_product(name: str): list[Product]</text>
  <text class="member" x="42" y="643">+ display_all(): void</text>
  <text class="member" x="42" y="663">+ get_products(): list[Product]</text>

  <!-- Product abstract class -->
  <rect class="box" x="520" y="470" width="500" height="334"/>
  <rect class="head" x="520" y="470" width="500" height="52"/>
  <text class="stereo" x="770" y="490" text-anchor="middle">«abstract»</text>
  <text class="abstract-name" x="770" y="510" text-anchor="middle">Product</text>
  <line class="line" x1="520" y1="612" x2="1020" y2="612"/>
  <text class="member" x="532" y="541">- __product_id: int</text>
  <text class="member" x="532" y="561">- __name: str</text>
  <text class="member" x="532" y="581">- __price: float</text>
  <text class="member" x="532" y="601">- __stock: int</text>
  <text class="member" x="532" y="631">+ __init__(product_id: int, name: str, price: float, stock: int)</text>
  <text class="member" x="532" y="651">+ get_product_id(): int</text>
  <text class="member" x="532" y="671">+ get_name(): str</text>
  <text class="member" x="532" y="691">+ get_price(): float</text>
  <text class="member" x="532" y="711">+ get_stock(): int</text>
  <text class="member" x="532" y="731">+ update_stock(new_stock: int): void</text>
  <text class="member" x="532" y="751">+ display_information(): void</text>
  <text class="member" x="532" y="771">+ to_dict(): dict</text>
  <text class="member abstract" x="532" y="791">+ get_fulfilment_info(): str {abstract}</text>

  <!-- CanBeShipped interface -->
  <rect class="box" x="1040" y="470" width="340" height="88"/>
  <rect class="head" x="1040" y="470" width="340" height="52"/>
  <text class="stereo" x="1210" y="490" text-anchor="middle">«interface»</text>
  <text class="name" x="1210" y="510" text-anchor="middle">CanBeShipped</text>
  <text class="member abstract" x="1052" y="545">+ calculate_shipping_cost(): float {abstract}</text>

  <!-- DigitalProduct class -->
  <rect class="box" x="330" y="900" width="420" height="206"/>
  <rect class="head" x="330" y="900" width="420" height="44"/>
  <text class="name" x="540" y="928" text-anchor="middle">DigitalProduct</text>
  <line class="line" x1="330" y1="974" x2="750" y2="974"/>
  <text class="member" x="342" y="963">- __download_size: float</text>
  <text class="member" x="342" y="993">+ __init__(product_id: int, name: str, price: float,</text>
  <text class="member" x="385" y="1013">stock: int, download_size: float)</text>
  <text class="member" x="342" y="1033">+ get_download_size(): float</text>
  <text class="member" x="342" y="1053">+ display_information(): void</text>
  <text class="member" x="342" y="1073">+ to_dict(): dict</text>
  <text class="member" x="342" y="1093">+ get_fulfilment_info(): str</text>

  <!-- PhysicalProduct class -->
  <rect class="box" x="800" y="900" width="440" height="266"/>
  <rect class="head" x="800" y="900" width="440" height="44"/>
  <text class="name" x="1020" y="928" text-anchor="middle">PhysicalProduct</text>
  <line class="line" x1="800" y1="1014" x2="1240" y2="1014"/>
  <text class="member static" x="812" y="963">+ BASE_SHIPPING_FEE: float = 5.00</text>
  <text class="member static" x="812" y="983">+ SHIPPING_RATE_PER_KG: float = 2.00</text>
  <text class="member" x="812" y="1003">- __weight: float</text>
  <text class="member" x="812" y="1033">+ __init__(product_id: int, name: str, price: float,</text>
  <text class="member" x="855" y="1053">stock: int, weight: float)</text>
  <text class="member" x="812" y="1073">+ get_weight(): float</text>
  <text class="member" x="812" y="1093">+ display_information(): void</text>
  <text class="member" x="812" y="1113">+ to_dict(): dict</text>
  <text class="member" x="812" y="1133">+ get_fulfilment_info(): str</text>
  <text class="member" x="812" y="1153">+ calculate_shipping_cost(): float</text>

  <!-- Aggregation: Inventory stores Products -->
  <polygon points="390,560 404,553 418,560 404,567" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <line class="line" x1="418" y1="560" x2="520" y2="560"/>
  <text class="label" x="469" y="550" text-anchor="middle">stores</text>
  <text class="mult" x="424" y="578">1</text>
  <text class="mult" x="512" y="578" text-anchor="end">0..*</text>

  <!-- Inheritance: PhysicalProduct and DigitalProduct are Products (solid line, hollow triangle) -->
  <polygon points="770,804 760,822 780,822" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <line class="line" x1="770" y1="822" x2="770" y2="850"/>
  <line class="line" x1="540" y1="850" x2="1020" y2="850"/>
  <line class="line" x1="540" y1="850" x2="540" y2="900"/>
  <line class="line" x1="1020" y1="850" x2="1020" y2="900"/>

  <!-- Realisation: PhysicalProduct implements CanBeShipped (dashed line, hollow triangle) -->
  <polygon points="1210,558 1200,576 1220,576" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <line class="line dash" x1="1210" y1="576" x2="1210" y2="900"/>
  <text class="label" x="1222" y="740">implements</text>

  <!-- Dependencies: main.py creates and uses the classes -->
  <line class="line dash" x1="480" y1="392" x2="300" y2="470"/>
  <polyline class="line" points="316.2,469.5 300,470 311.4,458.5"/>
  <text class="label" x="395" y="425" text-anchor="end">«creates, uses»</text>

  <line class="line dash" x1="800" y1="392" x2="800" y2="470"/>
  <polyline class="line" points="794,455 800,470 806,455"/>
  <text class="label" x="810" y="435">«uses»</text>

  <polyline class="line dash" points="440,372 12,372 12,1200 1020,1200"/>
  <line class="line dash" x1="540" y1="1200" x2="540" y2="1106"/>
  <polyline class="line" points="534,1121 540,1106 546,1121"/>
  <line class="line dash" x1="1020" y1="1200" x2="1020" y2="1166"/>
  <polyline class="line" points="1014,1181 1020,1166 1026,1181"/>
  <text class="label" x="200" y="1192">«creates»</text>

  <!-- Legend -->
  <text class="legend" x="30" y="1240">Visibility: + public, - private (double-underscore attribute, name-mangled by Python). Underlined members are class attributes shared by every PhysicalProduct.</text>
  <text class="legend" x="30" y="1260">«abstract» Product cannot be instantiated. Italic {abstract} methods have no implementation and must be implemented by subclasses. «interface» CanBeShipped is an ABC with only abstract methods.</text>
  <text class="legend" x="30" y="1280">Solid line + hollow triangle: inheritance (PhysicalProduct and DigitalProduct are Products). Dashed line + hollow triangle: realisation (PhysicalProduct implements CanBeShipped).</text>
  <text class="legend" x="30" y="1300">Hollow diamond: aggregation (one Inventory stores 0..* Products). Dashed arrow: dependency (main.py is the main program, not a class; it creates the objects and calls their methods).</text>
</svg>
