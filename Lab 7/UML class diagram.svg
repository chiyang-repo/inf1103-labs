<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="870" viewBox="0 0 1120 870">
  <style>
    .box { fill: #ffffff; stroke: #1f2933; stroke-width: 1.5; }
    .head { fill: #e8eef6; stroke: #1f2933; stroke-width: 1.5; }
    .main { stroke-dasharray: 7 4; }
    .title { font: bold 20px Arial, Helvetica, sans-serif; fill: #1f2933; }
    .name { font: bold 16px Arial, Helvetica, sans-serif; fill: #1f2933; }
    .stereo { font: italic 12px Arial, Helvetica, sans-serif; fill: #3e4c59; }
    .member { font: 13px Consolas, "Courier New", monospace; fill: #1f2933; }
    .label { font: italic 13px Arial, Helvetica, sans-serif; fill: #1f2933; }
    .mult { font: 13px Arial, Helvetica, sans-serif; fill: #1f2933; }
    .legend { font: 12px Arial, Helvetica, sans-serif; fill: #52606d; }
    .line { stroke: #1f2933; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 7 5; }
  </style>

  <rect width="1120" height="870" fill="#ffffff"/>
  <text class="title" x="560" y="44" text-anchor="middle">Inventory Management System: UML Class Diagram</text>

  <!-- main.py (main program, not a class) -->
  <rect class="box main" x="330" y="80" width="460" height="262"/>
  <rect class="head main" x="330" y="80" width="460" height="52"/>
  <text class="stereo" x="560" y="100" text-anchor="middle">«main program»</text>
  <text class="name" x="560" y="120" text-anchor="middle">main.py</text>
  <text class="member" x="342" y="151">+ load_inventory(inventory: Inventory): bool</text>
  <text class="member" x="342" y="171">+ save_inventory(inventory: Inventory): void</text>
  <text class="member" x="342" y="191">+ validate_product_entry(product_name: str,</text>
  <text class="member" x="385" y="211">product_quantity: str, product_price: str): bool</text>
  <text class="member" x="342" y="231">+ transactional_history(action: str, product_name: str,</text>
  <text class="member" x="385" y="251">product_quantity, product_price): void</text>
  <text class="member" x="342" y="271">+ add_product(inventory: Inventory): void</text>
  <text class="member" x="342" y="291">+ update_stock(inventory: Inventory): void</text>
  <text class="member" x="342" y="311">+ search_product(inventory: Inventory): void</text>
  <text class="member" x="342" y="331">+ main(): void</text>

  <!-- Inventory class -->
  <rect class="box" x="40" y="470" width="360" height="204"/>
  <rect class="head" x="40" y="470" width="360" height="44"/>
  <text class="name" x="220" y="498" text-anchor="middle">Inventory</text>
  <line class="line" x1="40" y1="544" x2="400" y2="544"/>
  <text class="member" x="52" y="533">- __products: list[Product]</text>
  <text class="member" x="52" y="563">+ __init__()</text>
  <text class="member" x="52" y="583">+ add_product(product: Product): void</text>
  <text class="member" x="52" y="603">+ find_by_id(product_id: int): Product | None</text>
  <text class="member" x="52" y="623">+ search_product(name: str): list[Product]</text>
  <text class="member" x="52" y="643">+ display_all(): void</text>
  <text class="member" x="52" y="663">+ get_products(): list[Product]</text>

  <!-- Product class -->
  <rect class="box" x="590" y="470" width="500" height="284"/>
  <rect class="head" x="590" y="470" width="500" height="44"/>
  <text class="name" x="840" y="498" text-anchor="middle">Product</text>
  <line class="line" x1="590" y1="604" x2="1090" y2="604"/>
  <text class="member" x="602" y="533">- __product_id: int</text>
  <text class="member" x="602" y="553">- __name: str</text>
  <text class="member" x="602" y="573">- __price: float</text>
  <text class="member" x="602" y="593">- __stock: int</text>
  <text class="member" x="602" y="623">+ __init__(product_id: int, name: str, price: float, stock: int)</text>
  <text class="member" x="602" y="643">+ get_product_id(): int</text>
  <text class="member" x="602" y="663">+ get_name(): str</text>
  <text class="member" x="602" y="683">+ get_price(): float</text>
  <text class="member" x="602" y="703">+ get_stock(): int</text>
  <text class="member" x="602" y="723">+ update_stock(new_stock: int): void</text>
  <text class="member" x="602" y="743">+ display_product(): void</text>

  <!-- Aggregation: Inventory stores Products -->
  <polygon points="400,560 414,553 428,560 414,567" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <line class="line" x1="428" y1="560" x2="590" y2="560"/>
  <text class="label" x="514" y="550" text-anchor="middle">stores</text>
  <text class="mult" x="436" y="578">1</text>
  <text class="mult" x="582" y="578" text-anchor="end">0..*</text>

  <!-- Dependencies: main.py creates and uses the classes -->
  <line class="line dash" x1="420" y1="342" x2="300" y2="470"/>
  <polyline class="line" points="314.7,464.6 300,470 304.5,455.0"/>
  <text class="label" x="350" y="410" text-anchor="end">«creates, uses»</text>

  <line class="line dash" x1="700" y1="342" x2="820" y2="470"/>
  <polyline class="line" points="805.3,464.6 820,470 815.5,455.0"/>
  <text class="label" x="770" y="410">«creates»</text>

  <!-- Legend -->
  <text class="legend" x="40" y="804">Visibility: + public, - private (double-underscore attribute, name-mangled by Python).</text>
  <text class="legend" x="40" y="824">Hollow diamond: aggregation. One Inventory stores zero or more Product objects, which are created outside it and passed to add_product().</text>
  <text class="legend" x="40" y="844">Dashed arrow: dependency. main.py is the main program, not a class; it creates the Inventory and Product objects and calls their methods.</text>
</svg>
